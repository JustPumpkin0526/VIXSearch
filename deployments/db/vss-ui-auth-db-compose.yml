version: "3.8"

# Minimal standalone Postgres compose for the vss-ui auth DB
# Usage: set POSTGRES_PASSWORD (and optionally POSTGRES_USER/POSTGRES_DB) in environment
services:
  vss-ui-auth-db:
    image: postgres:15
    container_name: vss-ui-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vss_ui_auth}
      POSTGRES_USER: ${POSTGRES_USER:-vss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vss_pass}
    volumes:
      # Host-side data directory (default: deployments/data-dir/postgres-auth)
      - ${DB_DATA_DIR:-./deployments/data-dir}/postgres-auth:/var/lib/postgresql/data
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vss} -d ${POSTGRES_DB:-vss_ui_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      networks:
        - mdx_default
  mdx_default:
    external: true
