# YOLOv7 Korean license-plate character detector.
# DeepStream-compatible ONNX: images=[batch,3,224,224], output=[1,100,7]
# output columns: batch_id,x1,y1,x2,y2,class_id,score

class-attrs-all:
  pre-cluster-threshold: 0.25
  topk: 20

property:
  gpu-id: 0
  gie-unique-id: 3
  process-mode: 2
  network-type: 0
  network-mode: 2
  batch-size: 1
  force-implicit-batch-dim: 0

  infer-dims: 3;224;224
  net-scale-factor: 0.00392156862745098
  offsets: 0;0;0
  model-color-format: 0
  maintain-aspect-ratio: 1
  symmetric-padding: 1

  onnx-file: /opt/models/custom/obd_lpcs_kr.c89.yolov7.i224x224.db.v1.1.3.nms.fixed100_batched.onnx
  model-engine-file: /opt/engines/obd_lpcs_kr.c89.yolov7.i224x224.db.v1.1.3.nms.fixed100_batched_b1_gpu0_fp16.engine
  labelfile-path: /opt/models/custom/obd_lpcs_kr.c89.cls
  num-detected-classes: 89
  output-blob-names: output

  # NMS is already included in the exported ONNX model.
  cluster-mode: 4
  parse-bbox-func-name: NvDsInferParseCustomYoloV7LPR
  custom-lib-path: /opt/nvidia/deepstream/deepstream/lib/libnvdsinfer_custom_yolov7_lpr.so
